---
# Pinned tool versions are defined in ci/versions.env and verified in CI:
# pre-commit 4.7.0 | yamllint 1.38.0 | shellcheck 0.11.0.1 | ruff 0.17.4
# gitleaks 8.30.1  | terraform 1.17.0
minimum_pre_commit_version: "4.0.0"
default_install_hook_types:
  - pre-commit
repos:
  - repo: local
    hooks:
      - id: check-prose
        name: repository prose and banned-word audit
        entry: bash scripts/check-prose.sh
        language: system
        pass_filenames: false

      - id: gitleaks
        name: gitleaks secret and account ID scan
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      - id: yamllint
        name: yamllint strict YAML check
        entry: yamllint -c .yamllint.yml --strict
        language: system
        types: [yaml]

      - id: shellcheck
        name: shellcheck bash script analysis
        entry: shellcheck --severity=warning
        language: system
        types: [shell]

      - id: ruff-check
        name: ruff python linter
        entry: ruff check --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff python formatter check
        entry: ruff format --check --force-exclude
        language: system
        types: [python]

      - id: terraform-fmt
        name: terraform fmt check
        entry: terraform fmt -check -recursive
        language: system
        files: \.tf$
        pass_filenames: false
