[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "damolak-api"
version = "0.1.1"
description = "Stateless HTTP telemetry and secret-verified echo API for ECS Fargate"
readme = "README.md"
authors = [
  { name = "Gbure Thomas Gwamna" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "jinja2==3.1.6",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
